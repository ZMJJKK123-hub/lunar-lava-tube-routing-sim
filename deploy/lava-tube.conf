# nginx 配置文件: 月球熔岩管沙盘
# 放到 /etc/nginx/sites-available/ 或 /etc/nginx/conf.d/
# 记得把 5100 改成你 backend/sim/config.py 里设的实际 PORT

server {
    listen 8080;                          # 对外端口 (改成你想要的)
    server_name _;

    # 全部反代到 uvicorn (前端 + API + WebSocket)
    location / {
        proxy_pass http://127.0.0.1:5100;
        proxy_http_version 1.1;

        # WebSocket 支持 (必须)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket 长连接不超时
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }

    # 静态资源缓存 (前端 build 后的 js/css 带哈希, 可以长缓存)
    location /assets/ {
        proxy_pass http://127.0.0.1:5100/assets/;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
}
